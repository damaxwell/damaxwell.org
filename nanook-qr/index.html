<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Nanook</title>
    <link rel="icon" type="image/svg+xml" href="./assets/nanook-BNPvQGWg.svg" />
    <script type="module" crossorigin src="./assets/index-BUaACyP5.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bi_r12j_.css">
  </head>
  <body>
    <main>
      <h1>QR Nanook</h1>

      <section class="controls">
        <label class="wide">
          URL
          <input id="url" type="url" value="https://www.uaf.edu" spellcheck="false" autocomplete="off" />
        </label>

        <label>
          Dot size
          <input id="dotScale" type="range" min="0.5" max="1" step="0.05" value="0.85" />
        </label>
        <label>
          Nanook size
          <input id="logoScale" type="range" min="0.15" max="0.32" step="0.01" value="0.26" />
        </label>

        <div class="colors">
          <label>Dots <input id="fg" type="color" value="#236192" /></label>
          <label>Badge <input id="accent" type="color" value="#ffcd00" /></label>
          <label>Background <input id="bg" type="color" value="#ffffff" /></label>
          <label class="check"><input id="showLogo" type="checkbox" checked /> Show nanook</label>
        </div>
      </section>

      <div id="qr" class="qr" aria-live="polite"></div>
      <p id="error" class="error" hidden></p>

      <div class="actions">
        <button id="downloadSvg" type="button">Download SVG</button>
        <button id="downloadPng" type="button">Download PNG</button>
      </div>
    </main>
  </body>
</html>
